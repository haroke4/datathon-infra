# Install in /etc/nginx/sites-available/baklashka.toilap.com.
# Certbot's nginx plugin adds TLS and redirects after HTTP verification.
limit_req_zone $binary_remote_addr zone=datathon_uploads:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=datathon_api:10m rate=20r/s;

server {
    listen 80;
    server_name baklashka.toilap.com;
    client_max_body_size 101m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/v1/analyze {
        limit_req zone=datathon_uploads burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/datathon-proxy.conf;
    }

    location = /api/ui/analyze {
        limit_req zone=datathon_uploads burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/datathon-proxy.conf;
    }

    location /api/ {
        limit_req zone=datathon_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/datathon-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/datathon-proxy.conf;
    }
}
